  <title id="cosmos-title">Iscrop — уютный космос</title>
  <desc id="cosmos-desc">Плоская фирменная графика: золотое солнце с 67 лучами, сливовое перекрытие, орбитальные дуги и волновые линии. Художественная схема света, источника и приёмника.</desc>
